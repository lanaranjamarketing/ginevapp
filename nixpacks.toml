[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.curl", "php82Extensions.gd", "php82Extensions.zip", "nginx"]

[variables]
PHP_INI_SCAN_DIR = "/app/public"

[phases.build]
cmds = [
  "echo 'client_max_body_size 250M;' > /etc/nginx/conf.d/uploads.conf || true"
]